# Bicycle planning-simulator compatibility parameters; not a four-wheel dynamic model.
# Delays and rate limits are provisional simulation values, not identified hardware data.
/**:
  ros__parameters:
    simulated_frame_id: base_link
    origin_frame_id: map
    vehicle_model_type: DELAY_STEER_ACC_GEARED
    initialize_source: INITIAL_POSE_TOPIC
    timer_sampling_time_ms: 25
    add_measurement_noise: false
    vel_lim: 1.5
    vel_rate_lim: 1.0
    steer_lim: 0.7
    steer_rate_lim: 1.0
    acc_time_delay: 0.1
    acc_time_constant: 0.1
    steer_time_delay: 0.24
    steer_time_constant: 0.27
    steer_dead_band: 0.0
    x_stddev: 0.0001
    y_stddev: 0.0001
    enable_road_slope_simulation: true
